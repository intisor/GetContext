<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recon</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <img class="logo" src="icons/icon48.png" alt="Recon" />
        <div>
          <div class="title">Recon</div>
          <div class="subtitle">Upwork Client Intel</div>
        </div>
      </header>

      <div class="popup-body">
        <div class="row">
          <button id="analyze-btn" class="primary">Analyze Page</button>
        </div>
        <div class="row small">
          <button id="open-options">Open Settings</button>
          <button id="open-github">View on GitHub</button>
        </div>
      </div>

      <footer class="popup-footer">
        <span id="version">v?</span>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
